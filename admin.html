<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barba Studio - Painel Administrativo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    h1 { color: #f39c12; font-size: 1.3rem; letter-spacing: 0.5px; }
    .btn-voltar { background: transparent; border: 1px solid #777; color: #ccc; padding: 8px 15px; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .btn-voltar:hover { background: #333; color: #fff; }

    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: #1a1a1a; border: 1px solid #333; padding: 20px; border-radius: 8px; text-align: center; }
    .stat-card h3 { font-size: 0.75rem; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .stat-card span { font-size: 1.8rem; font-weight: bold; color: #f39c12; }

    .main-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
    @media(max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

    .panel { background: #1a1a1a; border: 1px solid #333; padding: 20px; border-radius: 8px; }
    .panel h2 { color: #f39c12; font-size: 1.05rem; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 8px; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; }
    
    .btn-success { width: 100%; padding: 11px; background: #27ae60; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    .btn-success:hover { background: #219653; }
    .btn-info { width: 100%; padding: 11px; background: #2980b9; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    .btn-info:hover { background: #2471a3; }
    .btn-danger { width: 100%; padding: 11px; background: #c0392b; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .btn-danger:hover { background: #962d22; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
    th { color: #f39c12; }
    
    .barbeiros-list { max-height: 150px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #333; border-radius: 5px; background: #222; }
    .barbeiro-item { padding: 10px 12px; border-bottom: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #ddd; }
    .barbeiro-item:hover { background: #333; }
    .barbeiro-item.selected { background: #f39c12; color: #121212; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>BARBA STUDIO • PAINEL ADMINISTRATIVO</h1>
    <a href="index.html" class="btn-voltar">← Voltar ao Site</a>
  </header>

  <div class="stats-container">
    <div class="stat-card">
      <h3>Total Agendamentos</h3>
      <span id="stat-total">0</span>
    </div>
    <div class="stat-card">
      <h3>Agendamentos Hoje</h3>
      <span id="stat-hoje">0</span>
    </div>
    <div class="stat-card">
      <h3>Barbeiros Ativos</h3>
      <span id="stat-barbeiros">0</span>
    </div>
  </div>

  <div class="main-grid">
    <!-- GESTÃO DE BARBEIROS -->
    <div class="panel">
      <h2>✂️ Gestão de Barbeiros</h2>
      <div class="form-group">
        <label>Barbeiros cadastrados (clique para selecionar):</label>
        <div id="lista-barbeiros-admin" class="barbeiros-list">
          <!-- Preenchido via JavaScript -->
        </div>
      </div>
      <div class="form-group">
        <input type="text" id="novo-barbeiro-nome" placeholder="Nome do novo barbeiro">
      </div>
      <button class="btn-success" onclick="cadastrarBarbeiroAdmin()">+ Cadastrar Novo Barbeiro</button>
      <button class="btn-info" onclick="listarClientesAdmin()">👥 Todos Clientes Cadastrados</button>
      <button class="btn-danger" onclick="excluirBarbeiroSelecionado()">🗑️ Excluir Barbeiro Selecionado</button>
    </div>

    <!-- TODOS OS AGENDAMENTOS -->
    <div class="panel">
      <h2>📅 Todos os Agendamentos</h2>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Barbeiro</th>
              <th>Cliente</th>
              <th>Data</th>
              <th>Hora</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="tabela-agendamentos">
            <tr><td colspan="6" style="text-align: center; color: #777;">A carregar agendamentos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://amdiaevxeajvqktdrbnz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtZGlhZXZ4ZWFqdnFrdGRyYm56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MTEzMjMsImV4cCI6MjEwODk4NzMyM30.8Dt7jMKYa49BU7b8LgArnRvKzOhPZCpBMqpz3uVfhL8";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let barbeiroSelecionadoId = null;

    document.addEventListener("DOMContentLoaded", () => {
      carregarDadosAdmin();
    });

    async function carregarDadosAdmin() {
      await carregarBarbeirosAdmin();
      await carregarAgendamentosAdmin();
    }

    async function carregarBarbeirosAdmin() {
      const container = document.getElementById("lista-barbeiros-admin");
      const { data, error } = await _supabase.from("profissionais").select("*").order("id", { ascending: true });
      
      if (error || !data) {
        container.innerHTML = '<div class="barbeiro-item">Erro ao carregar</div>';
        document.getElementById("stat-barbeiros").innerText = "0";
        return;
      }

      document.getElementById("stat-barbeiros").innerText = data.length;
      if (data.length === 0) {
        container.innerHTML = '<div class="barbeiro-item">Nenhum barbeiro registado.</div>';
        return;
      }

      container.innerHTML = "";
      data.forEach(b => {
        const div = document.createElement("div");
        div.className = `barbeiro-item ${barbeiroSelecionadoId === b.id ? 'selected' : ''}`;
        div.innerText = b.nome;
        div.onclick = () => {
          document.querySelectorAll('.barbeiro-item').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
          barbeiroSelecionadoId = b.id;
        };
        container.appendChild(div);
      });
    }

    async function cadastrarBarbeiroAdmin() {
      const nomeInput = document.getElementById("novo-barbeiro-nome");
      const nome = nomeInput.value.trim();
      if (!nome) {
        alert("Introduza o nome do barbeiro.");
        return;
      }

      const { error } = await _supabase.from("profissionais").insert([{ nome }]);
      if (error) {
        alert("Erro ao cadastrar barbeiro: " + error.message);
      } else {
        alert("Barbeiro cadastrado com sucesso!");
        nomeInput.value = "";
        carregarBarbeirosAdmin();
      }
    }

    async function excluirBarbeiroSelecionado() {
      if (!barbeiroSelecionadoId) {
        alert("Selecione um barbeiro na lista acima para excluir.");
        return;
      }
      if (!confirm("Tem certeza que deseja excluir este barbeiro?")) return;

      const { error } = await _supabase.from("profissionais").delete().eq("id", barbeiroSelecionadoId);
      if (error) {
        alert("Erro ao excluir: " + error.message);
      } else {
        alert("Barbeiro excluído com sucesso!");
        barbeiroSelecionadoId = null;
        carregarBarbeirosAdmin();
      }
    }

    async function carregarAgendamentosAdmin() {
      const tbody = document.getElementById("tabela-agendamentos");
      
      const { data, error } = await _supabase
        .from("agendamentos")
        .select(`id, cliente_nome, data_agendamento, hora_agendamento, profissional_id, profissionais(nome)`)
        .order("data_agendamento", { ascending: true });

      if (error || !data) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #c0392b;">Erro ao carregar agendamentos.</td></tr>`;
        return;
      }

      document.getElementById("stat-total").innerText = data.length;
      
      const hojeStr = new Date().toISOString().split('T')[0];
      const agendamentosHoje = data.filter(a => a.data_agendamento === hojeStr);
      document.getElementById("stat-hoje").innerText = agendamentosHoje.length;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #777;">Nenhum agendamento encontrado.</td></tr>`;
        return;
      }

      tbody.innerHTML = "";
      data.forEach(a => {
        const nomeBarbeiro = a.profissionais ? a.profissionais.nome : "Desconhecido";
        tbody.innerHTML += `
          <tr>
            <td>${a.id}</td>
            <td>${nomeBarbeiro}</td>
            <td>${a.cliente_nome}</td>
            <td>${a.data_agendamento}</td>
            <td>${a.hora_agendamento}</td>
            <td><button onclick="excluirAgendamento(${a.id})" style="background:#c0392b;color:#fff;border:none;padding:5px 8px;border-radius:4px;cursor:pointer;">Excluir</button></td>
          </tr>
        `;
      });
    }

    async function excluirAgendamento(id) {
      if (!confirm("Deseja cancelar/excluir este agendamento?")) return;
      const { error } = await _supabase.from("agendamentos").delete().eq("id", id);
      if (error) {
        alert("Erro ao excluir agendamento.");
      } else {
        carregarAgendamentosAdmin();
      }
    }

    async function listarClientesAdmin() {
      const { data, error } = await _supabase.from("clientes").select("nome, telefone, email");
      if (error || !data) {
        alert("Erro ao buscar clientes.");
        return;
      }
      if (data.length === 0) {
        alert("Nenhum cliente cadastrado ainda.");
        return;
      }
      let lista = "CLIENTES CADASTRADOS:\n\n";
      data.forEach(c => {
        lista += `Nome: ${c.nome} | Tel: ${c.telefone} | Email: ${c.email || 'Não informado'}\n`;
      });
      alert(lista);
    }
  </script>
</body>
</html>
